/* ───── Полный экран ─────

   По нажатию:
   1) в Telegram 8.0+ открываем настоящий полноэкранный режим мини-приложения (tg.requestFullscreen);
   2) пробуем принудительно повернуть экран в альбомный: screen.orientation.lock('landscape')
      (в браузерах, где для этого нужен нативный fullscreen, включаем и его);
   3) если повернуть экран нельзя (блокировка поворота, iOS), разворачиваем картинку на 90° сами.
   Ориентацию определяем по screen.orientation, а не по размеру окна: клавиатура и панели Telegram не переключают режим. */

async function loadImg(mid,el){const ch=CH;if(!ch.imgs[mid])ch.imgs[mid]=api('session/img?id='+SID+'&mid='+mid).then(r=>(r&&r.img)||'');
  const u=await ch.imgs[mid];if(!u||!el.isConnected&&ch!==CH)return;el.src=u;el.onclick=()=>viewImg(u);
  el.onload=()=>{const box=el.closest('.cm'),row=el.closest('.mrow');if(box&&row===box.lastElementChild)box.scrollTop=box.scrollHeight}}
function viewImg(u){const o=document.createElement('div');o.className='imgv';const i=document.createElement('img');i.src=u;o.appendChild(i);o.onclick=()=>o.remove();document.body.appendChild(o)}
function chatDraw(fresh){['#cm','#fcm'].forEach(sel=>{const box=$(sel);if(!box)return;
  const near=!box.querySelector('.msg')||box.scrollHeight-box.scrollTop-box.clientHeight<90,e=box.querySelector('p');
  if(fresh.length){if(e)e.remove();fresh.forEach(m=>box.appendChild(msgNode(m)))}
  else if(!CH.msgs.length&&!e)box.innerHTML=`<p class="mu">${tr('no_msgs')}</p>`;
  if(near)box.scrollTop=box.scrollHeight})}
function badge(){const b=$('#bdg');if(!b)return;b.hidden=!CH.unread;b.textContent=CH.unread>9?'9+':CH.unread}
function chatVisible(){if(FS)return CH.open;const c=$('#schat');if(!c)return false;const r=c.getBoundingClientRect();return r.top<innerHeight-90&&r.bottom>60}
function ntf(m){let box=FS?$('#fst'):$('#ntf');if(!box){if(FS)return;box=document.createElement('div');box.id='ntf';document.body.appendChild(box)}
  const pr=(SS&&SS.peer)||{},d=document.createElement('div');d.className='toast';
  const a=document.createElement('div');a.className='av xs';a.textContent=pr.avatar||'🎬';
  const t=document.createElement('div');t.className='tt';const n=document.createElement('b');n.textContent=pr.name||tr('buff');
  const x=document.createElement('span');x.textContent=m.img&&!m.text?tr('photo_lbl'):m.img?'📷 '+m.text:m.text;t.append(n,x);d.append(a,t);
  d.onclick=()=>{d.remove();if(FS){if(!CH.open){const bc=$('#bch');bc&&bc.click()}}else{const c=$('#schat');c&&c.scrollIntoView({behavior:'smooth',block:'center'})}};
  box.appendChild(d);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>d.remove(),6000)}
function floatEmoji(e){const st=$('#stage');if(!st)return;const s=document.createElement('span');s.className='fl';s.textContent=e;s.style.left=(8+Math.random()*70)+'%';st.appendChild(s);setTimeout(()=>s.remove(),2600)}
function onMsgIn(m){
  if(REACT.includes(m.text)){floatEmoji(m.text);return}
  if(m.me)return;
  if(FS&&!CH.open){CH.unread++;badge()}
  if(!chatVisible())ntf(m)}
async function chatFetch(){
  const ch=CH;if(ch.loading||!SID)return;ch.loading=true;
  try{const r=await api('session/chat?id='+SID+'&after='+ch.last);
    if(ch!==CH||!r.msgs)return;
    const first=!ch.init;ch.init=true;
    const fresh=r.msgs.filter(m=>m.id>ch.last);fresh.forEach(m=>{ch.msgs.push(m);ch.last=m.id});
    chatDraw(fresh);if(!first)fresh.forEach(onMsgIn)}
  finally{ch.loading=false}}
async function chatSend(text,img){text=(text||'').trim();if((!text&&!img)||!SS||SS.status!='active')return;
  const r=await post('session/chat',{id:SID,text,img});
  if(r.error&&r.error!='slow'){say(errText(r));return}
  chatFetch()}
async function chatSendImg(file){if(!file)return;const d=await shrink(file,900,.72);if(d)chatSend('',d)}
function typPing(){if(!SS||SS.status!='active')return;const n=Date.now();if(n-TYP.sent>2500){TYP.sent=n;post('session/typing',{id:SID})}}
function typDraw(){const on=!!(SS&&SS.peer_typing);['#typ','#ftyp'].forEach(sel=>{const e=$(sel);if(!e||e.dataset.on==String(on))return;e.dataset.on=on;
  e.innerHTML=on?esc(tr('typing',{n:(SS.peer&&SS.peer.name)||tr('buff')}))+'<i class="dots"></i>':''})}

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-rx]');if(b)chatSend(b.dataset.rx)});

function head(){const s=SS;$('#sh').innerHTML=`<div class="sec" style="padding:10px 14px"><div class="hd" style="margin:0"><b>${tr('w_with',{n:esc(s.peer?.name||tr('buff'))})}</b><span class="mu">${s.peer_on?`<span class="dot"></span>${tr('w_peer_on')}`:`<span class="dot off"></span>${tr('w_peer_off')}`}</span></div></div>`}

function ctlRender(){const s=SS,host=s.role=='host',me=host?s.hr:s.gr,pe=host?s.gr:s.hr,n=esc(s.peer?.name||tr('buff'));
  const st=v=>v?`<b class="badge">✓ ${tr('w_ready_st')}</b>`:`<b class="mu">${tr('w_notready')}</b>`;
  let h='';
  if(!s.started){
    if(host)h+=`<div class="sec"><div style="display:flex;gap:8px;margin-bottom:10px"><input id="wu" style="margin:0" placeholder="${tr('w_link_ph')}" value="${esc(draft)}" autocapitalize="off" autocomplete="off" inputmode="url"><button class="ghost" id="wp" title="${tr('w_paste')}">📋</button></div><button class="go" id="wl" style="width:100%">${s.kind?tr('w_change'):tr('w_set')}</button><p class="mu" style="margin-top:8px;font-size:12px">${tr('w_hint')}</p></div>`;
    if(s.kind)h+=`<div class="sec"><div class="hd"><span>${tr('w_you')}</span>${st(me)}</div><div class="hd"><span>${n}</span>${st(pe)}</div><button class="go" id="wr" style="width:100%">${me?tr('w_unready'):tr('w_ready')}</button><p class="mu" style="margin-top:8px;font-size:12px">${tr('w_both')}</p></div>`;
    else if(!host)h+=`<div class="sec"><p class="mu">${tr('w_wait_media')}</p></div>`;
  }else h+=`<div class="sec"><div class="mu">${host?tr('w_host_ctl'):tr('w_guest_ctl',{n})}</div><div class="wrap" style="margin:10px 0 0">${host?`<button class="ghost" id="wx">${tr('w_stop_watch')}</button>`:''}<button class="ghost" id="wf">⛶ ${tr('fs_enter')}</button></div></div>`;
  h+=`<button class="ghost" id="we" style="width:100%;margin-bottom:12px">${tr('w_end')}</button>`;
  $('#sc').innerHTML=h;
  if($('#wu')){$('#wu').oninput=e=>draft=e.target.value;$('#wu').onkeydown=e=>{if(e.key=='Enter')$('#wl').click()}}
  if($('#wp'))$('#wp').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t){$('#wu').value=t;draft=t}}catch(e){$('#wu').focus()}};
  if($('#wl'))$('#wl').onclick=async()=>{const u=$('#wu').value.trim();if(!u)return;const b=$('#wl'),t=b.textContent;b.disabled=true;b.textContent=tr('w_loading');
    const r=await post('session/media',{id:SID,url:u});if(b.isConnected){b.disabled=false;b.textContent=t}
    if(r.error){say(errText(r));return}draft='';sessPoll()};
  if($('#wr'))$('#wr').onclick=async()=>{const r=await post('session/ready',{id:SID,ready:me?0:1});if(r.error)say(errText(r));sessPoll()};
  if($('#wx'))$('#wx').onclick=async()=>{await post('session/ctl',{id:SID,act:'reset',pos:0});sessPoll()};
  if($('#wf'))$('#wf').onclick=()=>enterFs();
  $('#we').onclick=()=>{const go=async()=>{await post('session/stop',{id:SID});PEND.active=null;nav('watch','v_watch')};tg.showConfirm?tg.showConfirm(tr('w_end_q'),ok=>ok&&go()):go()}}

async function sessPoll(){
  if(view!='session'||polling)return;polling=true;
  try{
    const t0=Date.now(),r=await api('session?id='+SID+'&v='+(SS?SS.ver:0)),t1=Date.now();
    if(view!='session'||!sessT)return;
    if(r.error){if(r.error!='net'){sessStop();nav('watch','v_watch')}return}
    if(t1-t0<2500)OFF=r.now-(t0+t1)/2000;
    if(r.same){SS.peer_on=r.peer_on;SS.peer_typing=r.peer_typing}
    else{
      const prev=SS;SS=r;
      if(r.status!='active'){say(tr('w_ended'));PEND.active=null;sessStop();nav('watch','v_watch');return}
      onState(prev);ctlRender()}
    if(lastOn!==SS.peer_on||!r.same){lastOn=SS.peer_on;head()}
    typDraw();
    guestApply();
    if(r.chat>CH.last||!CH.init)chatFetch()}
  finally{polling=false}}

VIEWS.session=function(){
  if(sessT)return;
  app.innerHTML=`<div id="sh"></div>
<div id="stage"><div id="spw" style="display:none"><div id="sp"></div><div id="shield"></div><button class="go" id="tap" style="display:none">${tr('w_tap')}</button></div>
<div id="fso" style="display:none"><div id="fsb"><button id="bch" title="${tr('fs_chat')}">💬<i id="bdg" hidden></i></button><button id="brt" title="${tr('fs_rot')}" style="display:none">⟳</button><button id="bfs" title="${tr('fs_enter')}">⛶</button></div><div id="fst"></div>
<div id="fsc" hidden><div class="cm" id="fcm"></div><div class="typ" id="ftyp"></div><div class="react">${rxHTML()}</div><div class="cin"><label class="ghost att">📷<input class="phin" type="file" accept="image/*" hidden></label><input id="fci" placeholder="${tr('msg_ph')}" maxlength="500" autocomplete="off" enterkeyhint="send"><button class="go" id="fcs">➤</button></div></div></div></div>
<div id="sc"></div>
<div class="sec" id="schat"><div class="hd"><b>💬 ${tr('c_title')}</b></div><div class="cm" id="cm"></div><div class="typ" id="typ"></div><div class="react">${rxHTML()}</div><div class="cin"><label class="ghost att">📷<input class="phin" type="file" accept="image/*" hidden></label><input id="cmi" placeholder="${tr('msg_ph')}" maxlength="500" autocomplete="off" enterkeyhint="send"><button class="go" id="cms">➤</button></div></div>`;
  $('#tap').onclick=()=>{if(SP&&SP.rd){SP.play();stall=hstall=0;lastSeek=0;tapShow(false)}};
  $('#bfs').onclick=fsToggle;
  $$('.phin').forEach(i=>i.onchange=async e=>{const f=e.target.files[0];e.target.value='';await chatSendImg(f)});
  $('#brt').onclick=()=>{FSPORT=!FSPORT;fsLayout()};
  $('#bch').onclick=()=>{CH.open=!CH.open;$('#stage').classList.toggle('co',CH.open);$('#fsc').hidden=!CH.open;if(CH.open){CH.unread=0;badge();const b=$('#fcm');b.scrollTop=b.scrollHeight}};
  $('#shield').ondblclick=fsToggle;
  const bindIn=(i,b)=>{const go=()=>{const t=$(i).value;$(i).value='';chatSend(t)};$(b).onclick=go;$(i).onkeydown=e=>{if(e.key=='Enter')go()};$(i).oninput=e=>{if(e.target.value.trim())typPing()}};
  bindIn('#cmi','#cms');bindIn('#fci','#fcs');
  sessT=setInterval(sessPoll,1000);hostT=setInterval(hostTick,700);sessPoll()};

/* ───── Список: приглашения, активная сессия, кого позвать ───── */
const shareLink=l=>{const u='https://t.me/share/url?url='+encodeURIComponent(l)+'&text='+encodeURIComponent(tr('w_share_text'));tg.openTelegramLink?tg.openTelegramLink(u):open(u)};
VIEWS.watch=function(){Promise.all([api('session/pending'),api('friends')]).then(([p,f])=>{
  if(view!='watch'||!Array.isArray(p.invites)||!Array.isArray(f))return;PEND=p;pendSig=sigOf(p);banner();
  const nm=u=>esc(u?.name||tr('buff')),link=p.sent.find(i=>i.link),sent=p.sent.filter(i=>!i.link);
  f.sort((a,b)=>(b.online?1:0)-(a.online?1:0));                                   // кто в сети — выше
  app.innerHTML=`${p.active?`<div class="sec"><h2>${tr('w_active')}</h2><div class="row" style="align-items:center;cursor:default"><div class="av s">${esc(p.active.peer?.avatar||'🎬')}</div><div style="flex:1;min-width:0"><div class="t">${nm(p.active.peer)}</div></div><button class="go" data-wo="${p.active.id}">${tr('w_open')}</button></div></div>`:''}
${sent.map(i=>`<div class="sec"><div class="hd" style="margin:0"><span>${tr('w_sent_to',{n:nm(i.to)})}</span><button class="ghost" data-wc="${i.id}">${tr('cancel')}</button></div></div>`).join('')}
<div class="sec"><h2>${tr('w_link_t')}</h2><p class="mu" style="margin-bottom:10px">${tr('w_link_hint')}</p>
${link?`<div class="mu" style="margin-bottom:6px">${tr('w_link_wait')}</div><div class="mu" style="word-break:break-all;color:var(--go);margin-bottom:10px">${esc(link.link)}</div><div class="wrap" style="margin:0"><button class="go" id="ls">${tr('w_share')}</button><button class="ghost" id="lc">${tr('copy')}</button><button class="ghost" data-wc="${link.id}">${tr('cancel')}</button></div>`
:`<button class="go" id="lk" style="width:100%">${tr('w_link_b')}</button>`}</div>
<div class="sec"><h2>${tr('w_or_friend')}</h2>${f.length?`<div class="list">${f.map(x=>`<div class="row" data-wi="${x.uid}" style="align-items:center;padding:12px"><div class="av s">${esc(x.avatar)}</div><div style="flex:1;min-width:0"><div class="t">${nm(x)}</div><div class="m">${onl(x)}</div></div><span class="badge">${tr('w_call')} 🎬</span></div>`).join('')}</div>`:`<p class="mu">${tr('w_no_friends')}</p>`}</div>`;
  $$('[data-wo]').forEach(b=>b.onclick=()=>{SID=+b.dataset.wo;nav('session','v_watch')});
  $$('[data-wc]').forEach(b=>b.onclick=async()=>{await post('session/stop',{id:+b.dataset.wc});await pendPoll();render()});
  $$('[data-wi]').forEach(e=>e.onclick=()=>inviteTo(e.dataset.wi));
  if($('#lk'))$('#lk').onclick=async()=>{const r=await post('session/link',{});if(r.error){say(errText(r));return}await pendPoll();shareLink(r.link)};
  if($('#ls'))$('#ls').onclick=()=>shareLink(link.link);
  if($('#lc'))$('#lc').onclick=e=>copyCode(e.target,link.link);
  clearInterval(chatT);chatT=setInterval(pendPoll,2500)})};                        // пока висит приглашение, смотрим, принял ли собеседник

async function inviteTo(id){const r=await post('session/invite',{fid:+id});if(r.error){say(errText(r));return}await pendPoll();nav('watch','v_watch')}
async function acceptInv(id){const r=await post('session/respond',{id:+id,accept:1});if(r.error){say(errText(r));pendPoll();return}SID=+id;await pendPoll();nav('session','v_watch')}
async function declineInv(id){await post('session/respond',{id:+id,accept:0});await pendPoll();if(view=='watch')render()}
async function pendPoll(){if(document.hidden)return;const r=await api('session/pending');if(!(r&&Array.isArray(r.invites)))return;
  const had=PEND.active,sig=sigOf(r);PEND=r;banner();
  if(!had&&r.active&&view=='watch'){SID=r.active.id;nav('session','v_watch');return}   // собеседник принял приглашение: сразу заходим
  if(sig!==pendSig){pendSig=sig;if(view=='watch')render()}}
function banner(){const b=$('#inv');if(!b)return;const nm=u=>esc(u?.name||tr('buff'));let h='';
  PEND.invites.forEach(i=>h+=`<div class="ib"><span>🎬 ${tr('w_invite_from',{n:nm(i.from)})}</span><button class="go" data-ia="${i.id}">${tr('w_accept')}</button><button class="ghost" data-ix="${i.id}">✕</button></div>`);
  if(PEND.active&&view!='session')h+=`<div class="ib"><span>🎬 ${tr('w_with',{n:nm(PEND.active.peer)})}</span><button class="go" data-io="${PEND.active.id}">${tr('w_open')}</button></div>`;
  b.innerHTML=h;
  b.querySelectorAll('[data-ia]').forEach(e=>e.onclick=()=>acceptInv(e.dataset.ia));
  b.querySelectorAll('[data-ix]').forEach(e=>e.onclick=()=>declineInv(e.dataset.ix));
  b.querySelectorAll('[data-io]').forEach(e=>e.onclick=()=>{SID=+e.dataset.io;nav('session','v_watch')})}

/* Пинг и опрос — только пока приложение открыто на экране */
setInterval(()=>{if(!document.hidden)api('ping')},45000);
document.addEventListener('visibilitychange',()=>{document.documentElement.classList.toggle('pause',document.hidden);if(!document.hidden)api('ping')});
function boot(){load().then(async()=>{
  if(ME0.lang&&I18N[ME0.lang]&&ME0.lang!==S.lang){S.lang=ME0.lang;saveS();applyS()}   // язык, сохранённый на сервере, главнее
  else if(ME0.lang!==S.lang)post('me',{lang:S.lang});
  nav(S.start);await pendPoll();
  if(PEND.active&&PEND.active.fresh&&view!='session'){SID=PEND.active.id;nav('session','v_watch')}   // сессия идёт прямо сейчас: открываем её сразу
  setInterval(pendPoll,6000)})}
if(IN_TG||getTok())boot();else showLogin();
</script></body></html>
